name: Nuxt App CI/CD

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: pongpisut4989/devop-pipeline-d:latest
          cache-from: type=registry,ref=pongpisut4989/devop-pipeline-d:cache
          cache-to: type=registry,ref=pongpisut4989/devop-pipeline-d:cache,mode=max

  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull pongpisut4989/devop-pipeline-d:latest

            docker stop my-nuxt-app || true
            docker rm my-nuxt-app || true

            docker run -d \
              --restart always \
              --name my-nuxt-app \
              -p 80:3000 \
              pongpisut4989/devop-pipeline-d:latest
